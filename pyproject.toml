[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decklens"
version = "0.1.0"
description = "Engineering-aware semantic diff tool for CAE input files"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maya Kachina", email = "pj.kachina@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "CAE", "FEA", "diff", "OpenRadioss", "NASTRAN", "LS-DYNA",
    "semantic-diff", "engineering", "simulation", "comparison"
]

[project.urls]
Homepage = "https://github.com/pj-kachina/DeckLens-Semantic-Diff-for-CAE"
Documentation = "https://github.com/pj-kachina/DeckLens-Semantic-Diff-for-CAE#readme"
Repository = "https://github.com/pj-kachina/DeckLens-Semantic-Diff-for-CAE.git"
Issues = "https://github.com/pj-kachina/DeckLens-Semantic-Diff-for-CAE/issues"
Changelog = "https://github.com/pj-kachina/DeckLens-Semantic-Diff-for-CAE/blob/main/CHANGELOG.md"

dependencies = [
    "anthropic>=0.49.0",
    "click>=8.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
decklens = "decklens.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["decklens*"]
