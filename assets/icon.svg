<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0EA5E9" opacity="0.1"/>

  <!-- Main lens shape -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#0EA5E9" stroke-width="3"/>

  <!-- Inner detail - diff arrows -->
  <g transform="translate(64, 64)">
    <!-- Left arrow (before) -->
    <line x1="-20" y1="0" x2="-5" y2="0" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
    <polygon points="-5,0 -10,-3 -8,0 -10,3" fill="#EF4444"/>

    <!-- Right arrow (after) -->
    <line x1="5" y1="0" x2="20" y2="0" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
    <polygon points="20,0 15,-3 17,0 15,3" fill="#22C55E"/>

    <!-- Center circle (convergence point) -->
    <circle cx="0" cy="0" r="3" fill="#0EA5E9"/>

    <!-- Lower comparison symbols -->
    <text x="0" y="24" font-size="12" fill="#0EA5E9" text-anchor="middle" font-weight="bold">≢</text>
  </g>

  <!-- Top label arc -->
  <path d="M 35 25 A 29 29 0 0 1 93 25" fill="none" stroke="#0EA5E9" stroke-width="2" opacity="0.5"/>
</svg>
