<svg width="580" height="340" viewBox="0 0 580 340" xmlns="http://www.w3.org/2000/svg" font-family="'Consolas','Courier New',monospace" font-size="13">
  <!-- Window chrome -->
  <rect width="580" height="340" rx="8" fill="#1e1e1e"/>
  <rect width="580" height="32" rx="8" fill="#2d2d2d"/>
  <rect y="24" width="580" height="8" fill="#2d2d2d"/>
  <!-- Traffic lights -->
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>
  <!-- Tab -->
  <rect x="80" y="4" width="130" height="24" rx="4" fill="#1e1e1e"/>
  <text x="95" y="20" fill="#cccccc" font-size="12">sample.rad</text>
  <!-- Label -->
  <rect x="12" y="10" width="52" height="18" rx="3" fill="#0ea5e9"/>
  <text x="20" y="23" fill="#fff" font-size="11" font-weight="bold">AFTER</text>
  <!-- Line numbers -->
  <rect width="36" height="308" x="0" y="32" fill="#252526"/>
  <text x="6" y="56"  fill="#858585" font-size="12">1</text>
  <text x="6" y="74"  fill="#858585" font-size="12">2</text>
  <text x="6" y="92"  fill="#858585" font-size="12">3</text>
  <text x="6" y="110" fill="#858585" font-size="12">4</text>
  <text x="6" y="128" fill="#858585" font-size="12">5</text>
  <text x="6" y="146" fill="#858585" font-size="12">6</text>
  <text x="6" y="164" fill="#858585" font-size="12">7</text>
  <text x="6" y="182" fill="#858585" font-size="12">8</text>
  <text x="6" y="200" fill="#858585" font-size="12">9</text>
  <text x="4" y="218" fill="#858585" font-size="12">10</text>
  <text x="4" y="236" fill="#858585" font-size="12">11</text>
  <text x="4" y="254" fill="#858585" font-size="12">12</text>
  <text x="4" y="272" fill="#858585" font-size="12">13</text>
  <text x="4" y="290" fill="#858585" font-size="12">14</text>
  <text x="4" y="308" fill="#858585" font-size="12">15</text>
  <!-- Code with syntax highlighting -->
  <!-- #RADIOSS STARTER → comment (green) -->
  <text x="46" y="56"  fill="#6a9955">#RADIOSS STARTER</text>
  <!-- /BEGIN → keyword (blue) -->
  <text x="46" y="74"  fill="#569cd6">/BEGIN</text>
  <!-- /UNIT/1 → keyword + id -->
  <text x="46" y="92"  fill="#569cd6">/UNIT/</text><text x="126" y="92" fill="#9cdcfe">1</text>
  <!-- kg mm ms → plain text -->
  <text x="46" y="110" fill="#cccccc">kg mm ms</text>
  <!-- /MAT/LAW2/1 → keyword + type + id -->
  <text x="46" y="128" fill="#569cd6">/MAT/</text><text x="106" y="128" fill="#4ec9b0">LAW2</text><text x="150" y="128" fill="#9cdcfe">/1</text>
  <!-- STEEL_S235 → entity name (yellow) -->
  <text x="46" y="146" fill="#dcdcaa">STEEL_S235</text>
  <!-- numbers -->
  <text x="46" y="164" fill="#cccccc">  </text><text x="59" y="164" fill="#b5cea8">7.85E-09</text>
  <text x="46" y="182" fill="#cccccc">  </text><text x="59" y="182" fill="#b5cea8">210000.0</text><text x="138" y="182" fill="#cccccc">   </text><text x="159" y="182" fill="#b5cea8">0.3</text>
  <text x="46" y="200" fill="#cccccc">  </text><text x="59" y="200" fill="#b5cea8">355.0</text><text x="100" y="200" fill="#cccccc">   </text><text x="121" y="200" fill="#b5cea8">500.0</text><text x="162" y="200" fill="#cccccc">   </text><text x="183" y="200" fill="#b5cea8">0.2</text><text x="210" y="200" fill="#cccccc">   </text><text x="231" y="200" fill="#b5cea8">0.0</text>
  <!-- /PROP/TYPE1/1 -->
  <text x="46" y="218" fill="#569cd6">/PROP/</text><text x="116" y="218" fill="#4ec9b0">TYPE1</text><text x="168" y="218" fill="#9cdcfe">/1</text>
  <!-- SHELL_1MM -->
  <text x="46" y="236" fill="#dcdcaa">SHELL_1MM</text>
  <!-- numbers -->
  <text x="46" y="254" fill="#cccccc">  </text><text x="59" y="254" fill="#b5cea8">0  0  0  0  0  0  0  0  0</text>
  <text x="46" y="272" fill="#cccccc">  </text><text x="59" y="272" fill="#b5cea8">1.0  0.0  0.0  0  0</text>
  <!-- /BCS/1 -->
  <text x="46" y="290" fill="#569cd6">/BCS/</text><text x="100" y="290" fill="#9cdcfe">1</text>
  <!-- comment -->
  <text x="46" y="308" fill="#6a9955"># boundary conditions</text>
</svg>
